# No third-party anything; the contact page's code lives in the URL fragment and is never sent here.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
# Invite-only for now: keep the site out of search results.
add_header X-Robots-Tag "noindex, nofollow" always;
